[plugins]
shadow = {id = "com.gradleup.shadow", version.ref = "shadow"}
spotless = {id = "com.diffplug.spotless", version.ref = "spotless"}
maven-publish = {id = "com.vanniktech.maven.publish", version.ref = "mavenPublish"}
resource-factory-velocity = {id = "xyz.jpenilla.resource-factory-velocity-convention", version.ref = "resourceFactoryVelocity"}

[libraries]
okhttp = {group = "com.squareup.okhttp3", name = "okhttp-jvm", version.ref = "okhttp"}
