packetevents-api = {group = "com.github.retrooper", name = "packetevents-api", version.ref = "packetevents"}
jedis = {module = "redis.clients:jedis", version.ref = "jedis"}
guava = {group = "com.google.guava", name = "guava", version.ref = "guava"}
json = {group = "org.json", name = "json", version.ref = "json"}
skriptnew = {group = "com.github.SkriptLang", name = "Skript", version.ref = "skriptnew"}
skript213 = {group = "com.github.SkriptLang", name = "Skript", version.ref = "skript213"}
